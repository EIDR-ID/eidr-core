name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# eidr-core needs no EIDR_CORE_TOKEN: it is the root of the private-repo
# dependency chain (consumers install FROM here), not a consumer of it.
# Every consumer pins `@main`, so a broken push here reaches every
# consumer's next CI install before a human would notice — this workflow
# exists to catch that before it leaves this repo.
jobs:
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Bounds of pyproject.toml's requires-python floor (eidr-dq targets
        # 3.10+) and the newest consumer runtime (3.12-3.14).
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev + all extras
        run: pip install -e ".[dev,compare,bmr,aws]"
        # registry extra omitted: it pulls `eidr[client]` from PyPI, which
        # is unrelated to this repo's own correctness and would make CI
        # fail on the SDK's release cadence rather than eidr-core's.

      - name: Run tests
        run: pytest tests/ -q

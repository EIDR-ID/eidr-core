[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidr-core"
version = "0.0.1"
description = "Shared library, specifications, and reference data contracts for the EIDR tool portfolio"
readme = "README.md"
# Floor set by the oldest consumer (eidr-dq targets 3.10+); other consumers
# run 3.12-3.14.
requires-python = ">=3.10"
# No hard dependencies yet: modules are added incrementally as they are
# extracted from consumer projects (see docs/ and OVERLAPS.md). Optional
# extras will grow with them (openpyxl for bmr_io, psycopg for codes, the
# eidr SDK for registry, boto3 for secrets_loader).

[project.optional-dependencies]
# Placeholders; populate as each module lands.
# bmr = ["openpyxl>=3.1"]
# db = ["psycopg[binary]>=3.1"]
# registry = ["eidr[client]"]
# aws = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidr-core"
# 0.17.0 (2026-08-27): additive, both raised by eidr-dq while adopting its
# OPEN_TASKS T1/T2 -- get_registry_client gains writable= (and declares the
# Registry pass-through that already worked but was undeclared), and the
# failover signature matching is now case-insensitive. No existing call site
# changes.
# 0.16.0 (2026-08-26): bmr_io.open_sheet — the STREAMING reader, contributed
# by BMRtoAltID for sheets too large to materialize (60k rows x 500+ columns).
# read_sheet is now a list() over it, so both share one implementation.
# Additive; no existing caller changes. NOTE: BMRtoAltID's handoff proposed
# 0.15.0, which had already been taken by eidr_core.ids the same day — two
# sessions numbering independently is why a consumer must not pick the
# version (see CLAUDE.md "Proposing a change to shared code").
# 0.15.0 (2026-08-26): new MODULE — eidr_core.ids (EIDR Content ID syntax +
# ISO 7064 Mod 37,36 check character), accepted from BMR-Review over R13's
# second-consumer rule because the shape is externally specified and a wrong
# implementation fails silently against real data. Register decision log.
# 0.14.0 (2026-08-25): new public API surface — read_headers grew a
# header_row= parameter (compatible default) so a consumer that DISCOVERS
# its header row can stop keeping a second implementation (register R3).
# Minor, not patch: consumers pin @main so the number is informational, but
# it should still say "something was added" rather than "something was
# fixed".
# Prior note, 0.13.2 (2026-08-10): a dev-tooling-only bump — no runtime code
# moved, but T6 makes this repo's CI gate the precondition for consumers
# pinning @main, so WHICH checker verified the py.typed annotations is part
# of what that version identifies.
version = "0.17.0"
description = "Shared library, specifications, and reference data contracts for the EIDR tool portfolio"
readme = "README.md"
# Floor set by the oldest consumer (eidr-dq targets 3.10+); other consumers
# run 3.12-3.14.
requires-python = ">=3.10"
# No hard dependencies: every third-party need (rapidfuzz, openpyxl, boto3,
# the eidr SDK) is an optional extra below, imported lazily by the module
# that needs it — a consumer that only touches dependency-free modules
# (codes, normalize, ordering, altidtool_io, db_schemas, external, verify,
# registry.operation_status) installs with none of them. See OVERLAPS.md
# for what each module was extracted from.

[project.optional-dependencies]
# eidr_core.compare needs rapidfuzz (imported at module load). eidr_core.codes
# and eidr_core.normalize are dependency-free, so consumers that only need
# those (e.g. eidr-wikidata today) can install without extras.
compare = ["rapidfuzz>=3"]
# eidr_core.secrets_loader imports boto3 lazily — only needed for the AWS
# Secrets Manager path; local-file loading works without it.
aws = ["boto3>=1.34"]
# eidr_core.bmr_io imports openpyxl lazily — only read_sheet needs it; the
# zip-surgery / layout / plan helpers work without it.
bmr = ["openpyxl>=3.1"]
# eidr_core.registry is the portfolio's SDK factory — it imports `eidr` lazily
# inside get_registry_client(), so only consumers that actually talk to the
# registry API need this extra.
registry = ["eidr[client]>=0.1.0rc1"]
# Test runner. eidr-core's own test suite is deliberately thin — spec-driven
# modules are verified by the siblings' conformance tests (CLAUDE.md) — but
# safety surfaces whose wrong answer is SILENT are pinned here instead of
# in a consumer: tests/test_registry_operation_status.py (R5) and
# tests/test_external_failover.py (R13).
# ruff/mypy are pinned EXACTLY, not floored: this package ships py.typed, so
# consumers' type checkers read its real annotations (PEP 561) — the gate
# below is the publisher's side of that contract (T4, handoff 2026-08-09).
# Both tools add new checks in minor releases; an unpinned tool would turn
# CI red with no code change, which is exactly the failure mode the gate
# exists to prevent. Bump the pins deliberately, fixing what the new
# versions flag in the same commit.
#
# THESE VERSIONS MUST MATCH EVERY OTHER GATED REPO IN THE PORTFOLIO
# (eidr-wikidata today). A typed contract WRITTEN under one checker and
# READ under another reintroduces T4's failure mode one level up: a
# consumer-version-only finding in these annotations reddens the consumer
# while this repo's CI stays green. That is exactly what happened between
# 2026-08-09 and 2026-08-10 (we pinned 1.20.0, eidr-wikidata enforced
# 2.3.0); converged here 2026-08-10. Bump all gated repos in ONE sitting —
# the gated-repo list lives beside the EIDR_CORE_TOKEN holder ledger in the
# register, because both are per-repo copies with the same "miss one and it
# fails alone, later" hazard.
dev = [
    "pytest>=8.0",
    "ruff==0.16.2",
    "mypy==2.3.0",
]
# No `db` extra: eidr_core.db_schemas is stdlib-only (it reads packaged
# manifests and takes a connection the caller already owns), and no other
# module touches a driver — the external fact-cache seam is deliberately
# driver-free. Consumers declare their own psycopg/psycopg2.

[tool.ruff]
line-length = 100
# The requires-python floor, so pyupgrade never suggests syntax 3.10 lacks.
target-version = "py310"

[tool.ruff.lint]
# Same selection as eidr-wikidata (the portfolio's other gated repo), so a
# rule that passes in one repo means the same thing in the other.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E702 (multiple statements per line, semicolon): the extracted modules
# (bmr_io, compare) deliberately keep their source projects' compact
# zip-surgery/scorer style — restyling extraction-preserved code would
# churn diffs consumers track via @main for zero behavioral value.
ignore = ["E702"]

[tool.mypy]
# The requires-python floor: annotations must hold on the oldest consumer
# runtime (eidr-dq targets 3.10), not just the newest.
python_version = "3.10"
# Optional-extra imports (rapidfuzz, openpyxl, boto3, eidr) are absent in
# the base install; the gate must not require installing every extra.
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed marks the package as inline-typed (PEP 561) so consumers' type
# checkers (e.g. eidr-wikidata's mypy) read eidr_core's own annotations
# instead of treating it as untyped. compare-spec.json — the versioned
# tuning surface of the unified engine — and the golden-pair corpus ship
# inside the package so eidr_core.compare.spec / BMR-Review's golden.py
# locate them via importlib.resources in any install mode.
"eidr_core" = ["py.typed", "specs/*.json", "specs/golden_pairs/*.json",
               "specs/db_schemas/*/manifest.json",
               "specs/db_schemas/*/schema.sql",
               "specs/db_schemas/*/CHANGES.md"]
# word_alias.csv ships with the normalize package (aliases.py loads it
# relative to its own file; degrades gracefully if absent).
"eidr_core.normalize" = ["data/*.csv"]

[pytest]
# This repo contains no async code -- no `async def`, no `await`, no asyncio
# import anywhere in src/ or tests/ (verified 2026-09-07). pytest-asyncio is
# installed machine-wide for unrelated FastAPI work and auto-loads here anyway,
# where it does nothing except emit a DeprecationWarning on Python 3.14:
#
#   pytest_asyncio/plugin.py: DeprecationWarning: 'asyncio.get_event_loop_policy'
#   is deprecated and slated for removal in Python 3.16
#
# Disabling the plugin removes the CAUSE. A filterwarnings entry would hide the
# symptom, and a blanket DeprecationWarning ignore is worse than the warning --
# it would also silence deprecations in openpyxl, rapidfuzz and the SDK, which
# are the ones worth hearing before a Python upgrade breaks them.
#
# If this repo ever gains async code, delete this line rather than working
# around it; the plugin is needed at that point.
addopts = -p no:asyncio

testpaths = tests

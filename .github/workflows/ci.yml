name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This repo is PUBLIC and depends on no private repo, so the job needs no
# credential of any kind -- an anonymous clone is all pip requires.
# Every consumer pins `@main`, so a broken push here reaches every
# consumer's next CI install before a human would notice — this workflow
# exists to catch that before it leaves this repo.
jobs:
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Bounds of pyproject.toml's requires-python floor (eidr-dq targets
        # 3.10+) and the newest consumer runtime (3.12-3.14).
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev + all extras
        run: pip install -e ".[dev,compare,bmr,aws]"
        # registry extra omitted: it pulls `eidr[client]` from PyPI, which
        # is unrelated to this repo's own correctness and would make CI
        # fail on the SDK's release cadence rather than eidr-core's.

      # GATING, not advisory. eidr-core ships py.typed, so consumers' type
      # checkers (eidr-wikidata's mypy today) read this package's real
      # annotations — publishing a typed contract without verifying it means
      # any push here can silently turn a consumer's CI red (T4, handoff
      # 2026-08-09). Tool versions are pinned in the dev extra so a tool
      # release can't fail this job without a code change.
      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/eidr_core

      - name: Run tests
        run: pytest tests/ -q

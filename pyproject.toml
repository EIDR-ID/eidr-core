[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidr-core"
version = "0.5.0"
description = "Shared library, specifications, and reference data contracts for the EIDR tool portfolio"
readme = "README.md"
# Floor set by the oldest consumer (eidr-dq targets 3.10+); other consumers
# run 3.12-3.14.
requires-python = ">=3.10"
# No hard dependencies yet: modules are added incrementally as they are
# extracted from consumer projects (see docs/ and OVERLAPS.md). Optional
# extras will grow with them (openpyxl for bmr_io, psycopg for codes, the
# eidr SDK for registry, boto3 for secrets_loader).

[project.optional-dependencies]
# eidr_core.compare needs rapidfuzz (imported at module load). eidr_core.codes
# and eidr_core.normalize are dependency-free, so consumers that only need
# those (e.g. eidr-wikidata today) can install without extras.
compare = ["rapidfuzz>=3"]
# Placeholders; populate as each module lands.
# bmr = ["openpyxl>=3.1"]
# db = ["psycopg[binary]>=3.1"]
# registry = ["eidr[client]"]
# aws = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# word_alias.csv ships with the normalize package (aliases.py loads it
# relative to its own file; degrades gracefully if absent).
"eidr_core.normalize" = ["data/*.csv"]
# compare-spec.json — the versioned tuning surface of the unified engine —
# and the golden-pair corpus ship inside the package so
# eidr_core.compare.spec / BMR-Review's golden.py locate them via
# importlib.resources in any install mode.
"eidr_core" = ["specs/*.json", "specs/golden_pairs/*.json",
               "specs/db_schemas/*/manifest.json",
               "specs/db_schemas/*/schema.sql",
               "specs/db_schemas/*/CHANGES.md"]
